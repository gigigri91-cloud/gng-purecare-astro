# Build Astro static site și publică pe GitHub Pages (FĂRĂ Jekyll).
#
# IMPORTANT — Două workflow-uri pe push:
# - „Deploy GitHub Pages” (acesta) = build Astro + deploy → SITE-UL LIVE (verde).
# - „pages build and deployment” = workflow GitHub cu Jekyll pe tot repo-ul → eșuează
#   pe proiecte Astro; NU îl poți dezactiva din CLI. Logurile cu „jekyll v3.10” sunt de acolo.
# Ignoră eșecul Jekyll sau filtrează în Actions după „Deploy GitHub Pages”.
# Verificare API: build_type trebuie să fie „workflow”.
#
# Dacă în Actions vezi doar Jekyll și nu vezi acest workflow:
# → Settings → Pages → Source = „GitHub Actions”.
#
# Remediere sursă Pages (dacă e nevoie):
# 1. Repo → Settings → Pages
# 2. „Build and deployment” → „Source”: „GitHub Actions”.
#
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
