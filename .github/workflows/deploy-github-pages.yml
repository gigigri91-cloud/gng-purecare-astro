# Build Astro static site și publică pe GitHub Pages (FĂRĂ Jekyll).
#
# Dacă în Actions vezi „jekyll v3.10” / „jekyll-build-pages”:
# → GitHub încă folosește sursa „Deploy from a branch”, care pornește workflow-ul
#   automat „pages-build-deployment” (Jekyll). Astro NU poate fi construit așa.
#
# Remediere (o singură dată):
# 1. Repo → Settings → Pages
# 2. „Build and deployment” → „Source”: alege „GitHub Actions” (nu „Deploy from a branch”).
# 3. Actions → deschide „pages-build-deployment” (dacă mai apare) → poți ignora sau
#    lasă-l nefolosit; site-ul trebuie livrat de workflow-ul „Deploy GitHub Pages” de mai jos.
#
# Acțiuni pe Node 24 (deprecare Node 20 pe runneri GitHub).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
